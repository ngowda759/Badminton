services:
  postgres:
    image: postgres:17-alpine
    container_name: badminton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-badminton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badminton}
      POSTGRES_DB: ${POSTGRES_DB:-badminton}
      # Deterministic collation keeps index ordering stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - badminton-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-U`/`-d` keep the check honest when the defaults are overridden.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-badminton} -d ${POSTGRES_DB:-badminton}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  badminton-postgres-data:
    name: badminton-postgres-data
